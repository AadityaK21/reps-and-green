# Reps & Greens — Render Blueprint (backend API)
# Render → New → Blueprint → connect this repo → Render reads this file.
# Docs: https://render.com/docs/blueprint-spec
#
# One service serves everything: the website at /, the app at /app, and the API.
# Free plan sleeps after 15 min idle (first visit then takes ~50 s); use Starter for launch.
services:
  - type: web
    name: reps-greens-api
    runtime: docker
    plan: free                      # free tier: sleeps after 15 min idle, wakes on next request
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    # Bind Render's injected $PORT and run a single worker so the in-memory
    # rate limiter / realtime hub / cache stay consistent (no Redis on free tier).
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips=*
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: DB_NAME
        value: repsandgreens
      # Strong secret auto-generated by Render (app refuses to boot on the default).
      - key: JWT_SECRET
        generateValue: true
      # ---- set these in the Render dashboard (marked sync:false = not stored in git) ----
      - key: MONGO_URL              # mongodb+srv://... from MongoDB Atlas
        sync: false
      - key: FRONTEND_ORIGIN        # your site's URL, e.g. https://repsandgreens.in (or the onrender.com URL)
        sync: false
      - key: BASE_URL               # same URL; used in password-reset links and the QR code
        sync: false
      - key: COACH_EMAIL
        sync: false
      - key: COACH_PASSWORD
        sync: false
      # ---- optional integrations: leave blank to stay in safe mock mode ----
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: EMAIL_FROM             # e.g. Reps & Greens <hello@repsandgreens.in> (verified in Resend)
        sync: false
      - key: JWT_EXPIRES_MIN
        value: "1440"
      # ---- Android app, after building it with PWABuilder ----
      - key: ANDROID_PACKAGE
        sync: false
      - key: ANDROID_CERT_SHA256
        sync: false
