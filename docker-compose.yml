# Reps & Greens - full local/production stack.
#   docker compose up --build          # start api + mongo + redis
#   docker compose run --rm api python seed.py   # seed data once mongo is up
#
# Copy backend/.env.example -> backend/.env and set JWT_SECRET before production.
services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # override the .env host values so services resolve inside the compose network
      MONGO_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads          # persist local file uploads across restarts

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    # not published to the host by default - only the api talks to it

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  redis_data:
  uploads:
